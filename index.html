<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聴覚障害者向け 割引情報マップ (MVP版)</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header>
    <h1>🗺️ 聴覚障害者割引情報マップ</h1>
    <p>全国のレジャー施設・交通機関の割引情報を検索</p>
  </header>
  
  <main>
    <aside class="sidebar">
      <div class="filter-group">
        <label for="prefFilter">都道府県</label>
        <select id="prefFilter">
          <option value="all">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="keywordFilter">キーワード（施設名など）</label>
        <input type="text" id="keywordFilter" placeholder="検索ワードを入力..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;">
      </div>
      <div class="filter-group">
        <label for="genreFilter">カテゴリー</label>
        <select id="genreFilter">
          <option value="all">すべて</option>
          <option value="観光・レジャー施設">観光・レジャー施設</option>
          <option value="交通機関">交通機関</option>
          <option value="駐車場">駐車場</option>
        </select>
      </div>
      
      <div id="listContainer" class="list-container">
        <!-- リストがここに生成されます -->
      </div>

      <div class="sidebar-footer">
        <p class="disclaimer-text">
          ⚠️ <strong>免責事項</strong>: 掲載情報は調査時点のものです。手帳の種別・等級による条件や最新の料金は、お出かけ前に必ず各公式サイトまたは現地にてご確認ください。
        </p>
      </div>
    </aside>
    
    <div id="map" class="map-container"></div>
  </main>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCN_Xslxoq4tfmgtssIPKHyixBWPQUpiRQ"></script>
  <!-- データとアプリのロジック -->
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
