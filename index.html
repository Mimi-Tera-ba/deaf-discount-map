<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聴覚障害者割引情報マップ | 全国のレジャー・観光・交通 1,000件超</title>

  <!-- OGP (SNSシェア用カード) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="🗺️ 聴覚障害者割引情報マップ | 全国のレジャー・観光・交通 1,000件超">

  <meta property="og:image" content="ogp.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🗺️ 聴覚障害者割引情報マップ | 全国のレジャー・観光・交通 1,000件超">
  <meta name="twitter:description" content="全国1,000件以上のレジャー施設・駐車場・交通機関の障害者割引をマップと一覧で検索！お出かけや観光に役立つ無料情報マップ。">
  <meta name="twitter:image" content="ogp.jpg">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-title-wrap">
        <a href="https://miminoba.jp/" class="parent-site-link" title="ミミノバ TOPへ戻る">
          <span class="back-arrow">←</span> ミミノバ
        </a>
        <h1>🗺️ 聴覚障害者割引情報マップ</h1>
        <span class="header-tag">全国1,000件超</span>
      </div>
      
      <!-- 上部検索バー（都道府県 → キーワード → ジャンル → 現在地） -->
      <div class="top-search-bar">
        <div class="search-item">
          <label for="prefFilter">📍 都道府県</label>
          <select id="prefFilter">
            <option value="all">すべて</option>
          </select>
        </div>
        <div class="search-item keyword-box">
          <label for="keywordFilter">🔍 キーワード</label>
          <input type="text" id="keywordFilter" placeholder="施設名・住所などで検索...">
        </div>
        <div class="search-item">
          <label for="genreFilter">🏷️ ジャンル</label>
          <select id="genreFilter">
            <option value="all">すべて</option>
            <option value="観光・レジャー施設">観光・レジャー施設</option>
            <option value="交通機関">交通機関</option>
            <option value="駐車場">駐車場</option>
          </select>
        </div>
        <div class="search-item btn-box">
          <button id="currentLocationBtn" class="location-btn" title="現在地周辺を表示">
            🎯 現在地
          </button>
        </div>
      </div>
    </div>

    <!-- 検索バー直下の免責条項 -->
    <div class="header-disclaimer">
      ⚠️ 掲載情報は調査時点のものです。手帳の種別・等級による条件や最新の料金は、お出かけ前に必ず各公式サイト等でご確認ください。
    </div>
  </header>
  
  <main>
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>施設一覧 <span id="facilityCount" class="count-badge">読み込み中...</span></h2>
      </div>
      
      <div id="listContainer" class="list-container">
        <!-- リストがここに生成されます -->
      </div>

      <div class="sidebar-footer">
        <div class="footer-action-grid">
          <!-- 情報提供・修正窓口 -->
          <a href="https://forms.gle/BYxhmhi224nwxM6A6" target="_blank" rel="noopener noreferrer" class="footer-action-btn community-action-btn" title="新しい割引や情報の変更を報告する">
            <span class="action-icon">💡</span>
            <div class="action-text-wrap">
              <span class="action-title">情報提供・修正</span>
              <span class="action-sub">フォームへ報告 ↗</span>
            </div>
          </a>

          <!-- 楽天トラベル アフィリエイト専用リンク -->
          <a href="https://hb.afl.rakuten.co.jp/hgc/588d6a80.09e6b402.588d6a81.f2da5cdc/?pc=https%3A%2F%2Ftravel.rakuten.co.jp%2F&link_type=hybrid_url&ut=eyJwYWdlIjoidXJsIiwidHlwZSI6Imh5YnJpZF91cmwiLCJjb2wiOjF9" target="_blank" rel="noopener noreferrer nofollow" class="footer-action-btn travel-action-btn" title="周辺のホテル・宿を探す">
            <span class="action-icon">🏨</span>
            <div class="action-text-wrap">
              <span class="action-title">楽天トラベル [PR]</span>
              <span class="action-sub">周辺の宿を探す ↗</span>
            </div>
          </a>
        </div>
        <p class="footer-legal-note">※楽天トラベルリンクにはアフィリエイト広告が含まれます</p>
      </div>
    </aside>
    
    <div id="map" class="map-container"></div>
  </main>

  <!-- 初回アクセス用 Cookie同意バナー -->
  <div id="cookieBanner" class="cookie-banner" style="display: none;">
    <div class="cookie-content">
      <p class="cookie-text">
        🍪 <strong>Cookieの使用について</strong>: 当サイトでは利便性向上、利用状況の把握、および適切な広告配信のためCookie等を使用する場合があります。
      </p>
      <button id="acceptCookieBtn" class="cookie-btn">同意して閉じる</button>
    </div>
  </div>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCN_Xslxoq4tfmgtssIPKHyixBWPQUpiRQ"></script>
  <!-- データとアプリのロジック -->
  <script src="data.js?v=4"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
