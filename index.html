<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聴覚障害者向け 割引情報マップ (MVP版)</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header>
    <h1>🗺️ 聴覚障害者割引情報マップ</h1>
    <p>全国のレジャー施設・交通機関の割引情報を検索</p>
  </header>
  
  <main>
    <aside class="sidebar">
      <div class="filter-group">
        <label for="prefFilter">都道府県</label>
        <select id="prefFilter">
          <option value="all">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="genreFilter">カテゴリー</label>
        <select id="genreFilter">
          <option value="all">すべて</option>
          <option value="観光・レジャー施設">観光・レジャー施設</option>
          <option value="交通機関">交通機関</option>
          <option value="駐車場">駐車場</option>
        </select>
      </div>
      
      <div id="listContainer" class="list-container">
        <!-- リストがここに生成されます -->
      </div>
    </aside>
    
    <div id="map" class="map-container"></div>
  </main>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCN_Xslxoq4tfmgtssIPKHyixBWPQUpiRQ"></script>
  <!-- データとアプリのロジック -->
  <script src="data.js?v=4"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
